function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function aktifTarih(){
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  monday.setHours(0,0,0,0);
  return monday.toISOString().slice(0,10);
}

async function verileriYukle(){
  try{
    const snapshot = await getDocs(collection(db,"Plan"));
    planlar = snapshot.docs.map(doc => ({id:doc.id,...doc.data()}));

    if(!planlar.length){
      icerik.innerHTML='<p class="muted">Firestore\'da plan bulunamadı.</p>';
      return;
    }

    icerik.innerHTML='<p class="status">Veriler yüklendi. Ders ve sınıf seçiniz.</p>';
  }catch(error){
    console.error(error);
    icerik.innerHTML='<p class="muted">Planlar yüklenemedi. Firestore güvenlik kurallarını kontrol edin.</p>';
  }
}

function dersDegisti(){
  sinif.innerHTML='<option value="">Sınıf seçiniz</option>';
  hafta.innerHTML='<option value="">Önce sınıf seçiniz</option>';
  sinif.disabled=!ders.value;
  hafta.disabled=true;
  tarih.textContent="-";
  icerik.innerHTML='<p class="muted">Sınıf seçiniz.</p>';

  if(!ders.value) return;

  const siniflar=[...new Set(
    planlar
      .filter(x=>x.ders===ders.value)
      .map(x=>x.sinif)
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,"tr",{numeric:true}));

  siniflar.forEach(s=>{
    const o=document.createElement("option");
    o.value=s;
    o.textContent=s;
    sinif.appendChild(o);
  });

  if(!siniflar.length){
    sinif.innerHTML='<option value="">Bu ders için plan bulunamadı</option>';
  }
}

function sinifDegisti(){
  hafta.innerHTML='<option value="">Hafta seçiniz</option>';
  hafta.disabled=true;

  const liste=planlar
    .filter(x=>x.ders===ders.value && x.sinif===sinif.value)
    .sort((a,b)=>(a.start||"").localeCompare(b.start||""));

  if(!liste.length){
    icerik.innerHTML='<p class="muted">Bu sınıf için plan bulunamadı.</p>';
    return;
  }

  liste.forEach((x,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=x.date || x.start || ("Hafta "+(i+1));
    hafta.appendChild(o);
  });

  hafta.disabled=false;

  const aktif=aktifTarih();
  let i=liste.findIndex(x=>x.start && aktif>=x.start && aktif<=x.end);
  if(i<0) i=liste.findIndex(x=>x.start>=aktif);
  if(i<0) i=liste.length-1;

  hafta.value=String(i);
  goster(liste[i]);
}

function satir(baslik,metin){
  if(metin===undefined || metin===null || String(metin).trim()==="") return "";
  return `<div class="card"><h3>${baslik}</h3><div class="pre">${escapeHtml(metin)}</div></div>`;
}

/*
  Müfredat yapısına göre başlık:
  5, 6, 9, 10 -> Öğrenme Çıktısı
  11, 12 Beden Eğitimi -> Kazanım
  11, 12 Spor Eğitimi -> Kazanım
*/
function alanTuru(k){
  const sinifAdi = k.sinif || "";
  if(["5. Sınıf","6. Sınıf","9. Sınıf","10. Sınıf"].includes(sinifAdi)){
    return "ogrenme";
  }
  if(["11. Sınıf","12. Sınıf"].includes(sinifAdi)){
    return "kazanim";
  }
  return "ogrenme";
}

function anaAlanMetni(k){
  const tur = alanTuru(k);

  const outcome =
    k.outcome ||
    k.sonuc ||
    k["sonuç"] ||
    k["öğrenme_çıktısı"] ||
    k["öğrenme çıktısı"] ||
    k.ogrenme_ciktisi ||
    "";

  const kazanim =
    k.kazanim ||
    k["kazanım"] ||
    k.kazanımlar ||
    k["kazanımlar"] ||
    k.achievement ||
    k.achievements ||
    "";

  // 11. sınıf Beden Eğitimi için Firestore'da kazanım alanı eksikse
  // kaynak plandan tarih bazlı kazanımı kullan.
  if(tur === "kazanim"){
    if(kazanim) return kazanim;

    if(k.sinif === "11. Sınıf" &&
       k.ders === "Beden Eğitimi ve Spor" &&
       k.start &&
       kazanım11[k.start]){
      return kazanım11[k.start];
    }

    // 12. sınıf Beden Eğitimi ve Spor ile Spor Eğitimi kayıtlarında
    // mevcut "outcome" alanı zaten kazanım olarak tutuluyor.
    return outcome;
  }

  return outcome || kazanim;
}

  // Yeni planlarda Firestore'daki images alanı kullanılır.
  if(Array.isArray(k.images) && k.images.length){
    return k.images;
  }

  // Eski 10. sınıf kayıtlarının görselleri korunur.
  if(k.sinif==="10. Sınıf" && k.start){
    return eski10Gorselleri[k.start] || [];
  }

  // Görsel yüklenmemiş sınıflarda boş bırakılır.
  return [];
}

function goster(k){
  tarih.textContent=k.date || "-";

  let html="";
  const tur=alanTuru(k);
  const baslik=(tur==="kazanim") ? "📌 Kazanım" : "📌 Öğrenme Çıktısı";

  html += satir(baslik, anaAlanMetni(k));
  html += satir("🎯 Süreç Bileşenleri",k.process);
  html += satir("📖 Konu / İçerik Çerçevesi",k.topic);

  const gorseller=gorselleriBul(k);

  if(gorseller.length){
    html += `<div class="card">
      <h3>🖼️ Konu Görseli</h3>
      <div class="topic-images">
        ${gorseller.map(src=>`
          <img src="${escapeHtml(src)}" alt="Konu görseli" loading="lazy"
               onerror="this.style.display='none'">
        `).join("")}
      </div>
    </div>`;
  }

  html += satir("🔗 Programlar Arası Bileşenler",k.program);
  html += satir("📝 Öğrenme Kanıtları",k.evidence);
  html += satir("🧰 Araç-Gereçler / Değerlendirme",k.tools);
  html += satir("ℹ️ Ek Bilgi",k.extra);

  if(!html){
    html='<p class="muted">Bu hafta için plan bilgisi bulunmuyor.</p>';
  }

  icerik.innerHTML=html;
}

function haftaDegisti(){
  const liste=planlar
    .filter(x=>x.ders===ders.value && x.sinif===sinif.value)
    .sort((a,b)=>(a.start||"").localeCompare(b.start||""));

  const k=liste[Number(hafta.value)];
  if(k) goster(k);
}

ders.addEventListener("change",dersDegisti);
sinif.addEventListener("change",sinifDegisti);
hafta.addEventListener("change",haftaDegisti);

verileriYukle();
</script>
</body>
</html>
