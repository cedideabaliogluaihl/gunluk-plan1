<option value="">Ders seçiniz</option>
<option value="Beden Eğitimi ve Spor">Beden Eğitimi ve Spor</option>

<option value="Spor Eğitimi">Spor Eğitimi</option>
</select>


<label for="sinif">Sınıf Seçin</label>

<select id="sinif" disabled>
<option value="">Önce ders seçiniz</option>
</select>


<label for="hafta">Hafta</label>

<select id="hafta" disabled>
<option value="">Önce ders ve sınıf seçiniz</option>
</select>


<div class="box">

<h2>📅 Seçilen Hafta</h2>

<p id="tarih" class="muted">-</p>

<div id="icerik">
<p class="muted">Ders ve sınıf seçiniz.</p>

const db = getFirestore(app);

const sinif=document.getElementById("sinif");

const hafta=document.getElementById("hafta");

const tarih=document.getElementById("tarih");

const icerik=document.getElementById("icerik");


let planlar=[];

/* =========================================================
   AKTİF HAFTA
   ========================================================= */

function aktifTarih(){

 const now=new Date();

 const day=now.getDay();

 const monday=new Date(now);

 monday.setDate(
   now.getDate()-(day===0?6:day-1)
 );

 monday.setHours(0,0,0,0);

 return monday.toISOString().slice(0,10);
}


/* =========================================================
   FIRESTORE VERİLERİNİ YÜKLE
   ========================================================= */

async function verileriYukle(){

 try{

   const snapshot=await getDocs(
     collection(db,"Plan")
   );

   planlar=snapshot.docs.map(
     doc=>({
       id:doc.id,
       ...doc.data()
     })
   );


   if(!planlar.length){

     icerik.innerHTML=
       '<p class="muted">Firestore\'da plan bulunamadı.</p>';

     return;
   }


   icerik.innerHTML=
     '<p class="muted">Veriler yüklendi. Ders ve sınıf seçiniz.</p>';

 }catch(error){

   console.error(error);

   icerik.innerHTML=
     '<p class="muted">Planlar yüklenemedi. Firestore güvenlik kurallarını kontrol edin.</p>';
 }
}


/* =========================================================
   DERS DEĞİŞTİ
   ========================================================= */

function dersDegisti(){

 sinif.innerHTML=
   '<option value="">Sınıf seçiniz</option>';

 hafta.innerHTML=
   '<option value="">Önce sınıf seçiniz</option>';

 sinif.disabled=!ders.value;

 hafta.disabled=true;

 tarih.textContent="-";

 icerik.innerHTML=
   '<p class="muted">Sınıf seçiniz.</p>';


 if(!ders.value)return;


 const siniflar=[

   ...new Set(

     planlar

       .filter(x=>x.ders===ders.value)

       .map(x=>x.sinif)

   )

 ].sort();


 siniflar.forEach(s=>{

   const o=document.createElement("option");

   o.value=s;

   o.textContent=s;

   sinif.appendChild(o);

 });


 if(!siniflar.length){

   sinif.innerHTML=
     '<option value="">Bu ders için plan bulunamadı</option>';

   return;
 }

}


/* =========================================================
   SINIF DEĞİŞTİ
   ========================================================= */

function sinifDegisti(){

 hafta.innerHTML=
   '<option value="">Hafta seçiniz</option>';

 hafta.disabled=true;


 const liste=

   planlar

   .filter(
     x=>
       x.ders===ders.value &&
       x.sinif===sinif.value
   )

   .sort(
     (a,b)=>
       (a.start||"").localeCompare(b.start||"")
   );


 if(!liste.length){

   icerik.innerHTML=
     '<p class="muted">Bu sınıf için plan bulunamadı.</p>';

   return;
 }


 liste.forEach((x,i)=>{

   const o=document.createElement("option");

   o.value=i;

   o.textContent=x.date;

   hafta.appendChild(o);

 });


 hafta.disabled=false;


 const aktif=aktifTarih();

 let i=

   liste.findIndex(
     x=>
       x.start &&
       aktif>=x.start &&
       aktif<=x.end
   );


 if(i<0)

   i=liste.findIndex(
     x=>x.start>=aktif
   );


 if(i<0)

   i=liste.length-1;


 hafta.value=String(i);

 goster(liste[i]);

}


/* =========================================================
   KART OLUŞTUR
   ========================================================= */

function satir(baslik,metin){

 if(!metin)return "";

 return `

 <div class="card">

   <h3>${baslik}</h3>

   <div class="pre">${metin}</div>

 </div>

 `;

}


/* =========================================================
   HAFTAYI GÖSTER
   ========================================================= */

function goster(k){

 tarih.textContent=k.date || "-";


 let html="";


 html+=satir(
   "📌 Öğrenme Çıktısı",
   k.outcome
 );


 html+=satir(
   "🎯 Süreç Bileşenleri",
   k.process
 );


 html+=satir(
   "📖 Konu / İçerik Çerçevesi",
   k.topic
 );


 /*
    SINIFA GÖRE GÖRSEL SEÇ
 */

 let gorseller=[];


 if(k.sinif==="10. Sınıf"){

   gorseller=

     k.start
       ? (konuGorselleri10[k.start] || [])
       : [];

 }


 else if(k.sinif==="11. Sınıf"){

   gorseller=

     k.start
       ? (konuGorselleri11[k.start] || [])
       : [];

 }


 /*
    GÖRSELLERİ GÖSTER
 */

 if(gorseller.length){

   html+=`

   <div class="card">

     <h3>🖼️ Konu Görseli</h3>

     <div class="topic-images">

       ${gorseller.map(src=>`

         <img

           src="${src}"

           alt="Konu görseli"

           loading="lazy"

           onerror="this.style.display='none'"

         >

       `).join("")}

     </div>

   </div>

   `;

 }


 html+=satir(
   "🔗 Programlar Arası Bileşenler",
   k.program
 );


 html+=satir(
   "📝 Öğrenme Kanıtları",
   k.evidence
 );


 if(!html)

   html=
     '<p class="muted">Bu hafta için plan bilgisi bulunmuyor.</p>';


 icerik.innerHTML=html;

}


/* =========================================================
   HAFTA DEĞİŞTİ
   ========================================================= */

function haftaDegisti(){

 const liste=

   planlar

   .filter(
     x=>
       x.ders===ders.value &&
       x.sinif===sinif.value
   )

   .sort(
     (a,b)=>
       (a.start||"").localeCompare(b.start||"")
   );


 const k=liste[Number(hafta.value)];


 if(k)

   goster(k);

}


/* =========================================================
   OLAYLAR
   ========================================================= */

ders.addEventListener(
  "change",
  dersDegisti
);

sinif.addEventListener(
  "change",
  sinifDegisti
);

hafta.addEventListener(
  "change",
  haftaDegisti
);


/* =========================================================
   BAŞLAT
   ========================================================= */

verileriYukle();
