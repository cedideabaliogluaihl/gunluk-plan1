const ders=document.getElementById("ders"), sinif=document.getElementById("sinif"), hafta=document.getElementById("hafta");
const tarih=document.getElementById("tarih"), icerik=document.getElementById("icerik");

function aktifTarih(){
 const now=new Date(), day=now.getDay(), monday=new Date(now);
 monday.setDate(now.getDate()-(day===0?6:day-1)); monday.setHours(0,0,0,0);
 return monday.toISOString().slice(0,10);
}
function dersDegisti(){
 sinif.innerHTML='<option value="">Sınıf seçiniz</option>'; hafta.innerHTML='<option value="">Önce sınıf seçiniz</option>';
 sinif.disabled=!ders.value; hafta.disabled=true; tarih.textContent="-"; icerik.innerHTML='<p class="muted">Ders ve sınıf seçiniz.</p>';
 if(ders.value==="Beden Eğitimi ve Spor"){
   const o=document.createElement("option"); o.value="9. Sınıf"; o.textContent="9. Sınıf"; sinif.appendChild(o);
 }
}
function sinifDegisti(){
 hafta.innerHTML='<option value="">Hafta seçiniz</option>'; hafta.disabled=true;
 const liste=planlar.filter(x=>x.ders==="Beden Eğitimi ve Spor" && x.sinif==="9. Sınıf");
 if(!liste.length)return;
 liste.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=x.date;hafta.appendChild(o);});
 hafta.disabled=false;
 const aktif=aktifTarih(); let i=liste.findIndex(x=>x.start && aktif>=x.start && aktif<=x.end);
 if(i<0)i=liste.findIndex(x=>x.start>=aktif); if(i<0)i=liste.length-1;
 hafta.value=String(i); goster(liste[i]);
}
function satir(baslik,metin){ if(!metin)return ""; return `<div class="card"><h3>${baslik}</h3><div class="pre">${metin}</div></div>`; }
function goster(k){
 tarih.textContent=k.date;
 let html="";
 html+=satir("📌 Öğrenme Çıktısı",k.outcome);
 html+=satir("🎯 Süreç Bileşenleri",k.process);
 html+=satir("📖 Konu / İçerik Çerçevesi",k.topic);
 html+=satir("🔗 Programlar Arası Bileşenler",k.program);
 html+=satir("📝 Öğrenme Kanıtları",k.evidence);
 if(!html)html='<p class="muted">Bu hafta için plan bilgisi bulunmuyor.</p>';
 icerik.innerHTML=html;
}
function haftaDegisti(){
 const liste=planlar.filter(x=>x.ders==="Beden Eğitimi ve Spor" && x.sinif==="9. Sınıf");
 const k=liste[Number(hafta.value)]; if(k)goster(k);
}
ders.addEventListener("change",dersDegisti); sinif.addEventListener("change",sinifDegisti); hafta.addEventListener("change",haftaDegisti);
