const ders = document.getElementById("ders");
const sinif = document.getElementById("sinif");
const hafta = document.getElementById("hafta");
const tarih = document.getElementById("tarih");
const cikti = document.getElementById("cikti");

function aktifTarih() {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
  monday.setHours(0,0,0,0);
  return monday.toISOString().slice(0,10);
}

function dersDegisti() {
  sinif.innerHTML = '<option value="">Sınıf seçiniz</option>';
  hafta.innerHTML = '<option value="">Önce sınıf seçiniz</option>';
  sinif.disabled = !ders.value;
  hafta.disabled = true;
  tarih.textContent = "-";
  cikti.textContent = "Ders ve sınıf seçiniz.";

  if (!ders.value) return;

  // Bu ilk testte yalnızca 9. sınıf Beden Eğitimi verisi bağlı.
  if (ders.value === "Beden Eğitimi ve Spor") {
    const o = document.createElement("option");
    o.value = "9. Sınıf";
    o.textContent = "9. Sınıf";
    sinif.appendChild(o);
  }
}

function sinifDegisti() {
  hafta.innerHTML = '<option value="">Hafta seçiniz</option>';
  hafta.disabled = true;
  tarih.textContent = "-";
  cikti.textContent = "Hafta seçiniz.";

  const liste = planlar.filter(x => x.ders === ders.value && x.sinif === sinif.value);
  if (!liste.length) return;

  liste.forEach((x, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = x.hafta;
    hafta.appendChild(o);
  });

  hafta.disabled = false;

  // Bugünün bulunduğu haftayı otomatik seç.
  const aktif = aktifTarih();
  let index = liste.findIndex(x => aktif >= x.baslangic && aktif <= x.bitis);

  // Aktif hafta plan dışında ise, mevcut tarihe en yakın sonraki hafta.
  if (index === -1) {
    index = liste.findIndex(x => x.baslangic >= aktif);
  }
  if (index === -1) index = liste.length - 1;

  hafta.value = String(index);
  goster(liste[index]);
}

function goster(kayit) {
  tarih.textContent = kayit.hafta;
  cikti.innerHTML = '<span class="code">' + kayit.cikti.split(". ").slice(0,1)[0] + '.</span> ' +
                    kayit.cikti.substring(kayit.cikti.indexOf(". ") + 2);
}

function haftaDegisti() {
  const liste = planlar.filter(x => x.ders === ders.value && x.sinif === sinif.value);
  const kayit = liste[Number(hafta.value)];
  if (kayit) goster(kayit);
}

ders.addEventListener("change", dersDegisti);
sinif.addEventListener("change", sinifDegisti);
hafta.addEventListener("change", haftaDegisti);
